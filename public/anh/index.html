<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>GMAT tracker</title>
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GMAT">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232F5FE8'/%3E%3Cpath d='M22 14h20v36l-10-8-10 8z' fill='%23FFC2DA'/%3E%3C/svg%3E">
<link rel="preload" href="/fonts/CooperHewitt-Book.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/CooperHewitt-Semibold.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* /anh: Anh's GMAT tracker. One file, like the site's other tool pages. Cooper Hewitt comes from the site's /fonts/.
   Her colours are blue, pink and white: white ground, deep blue ink for text and rules, blue for where you are and for
   right answers, pink for bookmarks, wrong answers and what to do more of. Colour fills sit behind blue ink or carry white
   text on the strong blue; text itself is never pink or light blue. */
@font-face { font-family: 'Cooper Hewitt'; src: url('/fonts/CooperHewitt-Book.woff2') format('woff2'); font-weight: 400; font-style: normal; font-display: swap; }
@font-face { font-family: 'Cooper Hewitt'; src: url('/fonts/CooperHewitt-Medium.woff2') format('woff2'); font-weight: 500; font-style: normal; font-display: swap; }
@font-face { font-family: 'Cooper Hewitt'; src: url('/fonts/CooperHewitt-Semibold.woff2') format('woff2'); font-weight: 600; font-style: normal; font-display: swap; }
@font-face { font-family: 'Cooper Hewitt'; src: url('/fonts/CooperHewitt-Bold.woff2') format('woff2'); font-weight: 700; font-style: normal; font-display: swap; }

:root {
  --font: 'Cooper Hewitt', Helvetica, Arial, sans-serif;
  --ink: #13214A;
  --ink-2: #4B5679;
  --ink-3: #8790AC;
  --rule: #DCE2EF;
  --rule-2: #EEF1F8;
  --bg: #FFFFFF;
  --blue: #2F5FE8;
  --blue-hl: #BCD0FF;
  --blue-soft: #EBF1FF;
  --pink: #F0609E;
  --pink-hl: #FFC2DA;
  --pink-soft: #FFEEF5;
  --pad: 18px;
  --col: 760px;
  --radius: 14px;
}
@media (min-width: 720px) { :root { --pad: 32px; } }

* { box-sizing: border-box; }
html { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 17px; line-height: 1.45; -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; }
body { margin: 0; min-height: 100vh; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: inherit; text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 0.16em; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
[hidden] { display: none !important; }
.num { font-variant-numeric: tabular-nums; }
.wrap { max-width: var(--col); margin: 0 auto; padding: 0 var(--pad) 120px; }
.label { font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.12em; line-height: 1.4; margin: 0; color: var(--ink); }
.muted { color: var(--ink-2); }
.small { font-size: 14px; }
.tiny { font-size: 12.5px; }
h1 { font-size: 30px; line-height: 1.12; letter-spacing: -0.02em; font-weight: 600; margin: 0; }
h2 { font-size: 21px; line-height: 1.2; letter-spacing: -0.01em; font-weight: 600; margin: 0; }
h3 { font-size: 17px; font-weight: 600; margin: 0; }
p { margin: 0.4em 0; }
.mark-b { background: linear-gradient(transparent 55%, var(--blue-hl) 55%); padding: 0 0.08em; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
.mark-p { background: linear-gradient(transparent 55%, var(--pink-hl) 55%); padding: 0 0.08em; -webkit-box-decoration-break: clone; box-decoration-break: clone; }

/* Header and nav */
.top { position: sticky; top: 0; z-index: 20; background: rgba(255,255,255,0.96); backdrop-filter: saturate(1.4) blur(8px); -webkit-backdrop-filter: saturate(1.4) blur(8px); border-bottom: 4px solid var(--blue-hl); }
.top-in { max-width: var(--col); margin: 0 auto; padding: 12px var(--pad) 0; }
.brand-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; }
.brand svg { flex: none; }
.brand b { font-weight: 600; font-size: 18px; letter-spacing: -0.01em; }
.brand span { font-size: 13px; color: var(--ink-2); }
.sync { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: var(--ink-2); white-space: nowrap; }
.sync i { width: 9px; height: 9px; border-radius: 50%; background: var(--blue); display: inline-block; }
.sync[data-s='saving'] i { background: var(--blue-hl); }
.sync[data-s='offline'] i { background: var(--pink); }
.nav { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 10px 0 10px; margin: 0 calc(var(--pad) * -1); padding-left: var(--pad); padding-right: var(--pad); }
.nav::-webkit-scrollbar { display: none; }
.nav a { flex: none; text-decoration: none; font-size: 15px; padding: 6px 13px; border-radius: 999px; border: 1px solid var(--rule); white-space: nowrap; }
.nav a[aria-current='page'] { background: var(--blue-hl); border-color: var(--blue-hl); font-weight: 600; }
.nav a .count { font-size: 12px; color: var(--ink-2); margin-left: 4px; }

/* Sections, rows, cards */
.sec { border-top: 2px solid var(--ink); margin-top: 30px; padding-top: 12px; }
.sec-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
.page-head { padding: 26px 0 4px; }
.page-head p { color: var(--ink-2); margin-top: 6px; }
.rows { list-style: none; margin: 0; padding: 0; }
.rows > li { border-top: 1px solid var(--rule); padding: 12px 0; }
.rows > li:first-child { border-top: 0; }
.row-link { display: flex; align-items: center; gap: 12px; text-decoration: none; width: 100%; background: none; border: 0; padding: 0; text-align: left; cursor: pointer; }
.row-main { flex: 1; min-width: 0; }
.row-main .t { font-weight: 600; }
.row-main .s { display: block; font-size: 14px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; }
.row-side { text-align: right; flex: none; }
.card { border: 1px solid var(--rule); border-radius: var(--radius); padding: 16px; background: #fff; }
.card.blue { background: var(--blue-soft); border-color: var(--blue-soft); }
.card.pink { background: var(--pink-soft); border-color: var(--pink-soft); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.stat .v { font-size: clamp(22px, 6.4vw, 30px); font-weight: 600; letter-spacing: -0.02em; line-height: 1.1; }
.stat .k { font-size: 13px; color: var(--ink-2); }
.empty { color: var(--ink-2); padding: 18px 0; }

/* Buttons and chips: pills are the one rounded element */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 999px; border: 1.5px solid var(--ink); background: #fff; cursor: pointer; font-weight: 600; font-size: 16px; text-decoration: none; white-space: nowrap; -webkit-tap-highlight-color: transparent; }
.btn:disabled { opacity: 0.38; cursor: not-allowed; }
.btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
.btn.soft { background: var(--blue-soft); border-color: var(--blue-soft); }
.btn.pinky { background: var(--pink-hl); border-color: var(--pink-hl); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.big { min-height: 56px; font-size: 18px; padding: 0 26px; }
.btn.wide { width: 100%; }
.btn.sm { min-height: 36px; font-size: 14px; padding: 0 13px; border-width: 1px; }
.btns { display: flex; flex-wrap: wrap; gap: 10px; }
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 13px; border-radius: 999px; border: 1px solid var(--rule); background: #fff; cursor: pointer; font-size: 15px; white-space: nowrap; -webkit-tap-highlight-color: transparent; }
.chip.on { background: var(--blue-hl); border-color: var(--blue-hl); font-weight: 600; }
.chip.pk.on { background: var(--pink-hl); border-color: var(--pink-hl); }
.chip:disabled { opacity: 0.4; cursor: not-allowed; }
.chips { display: flex; flex-wrap: wrap; gap: 7px; }
.seg { display: inline-flex; border: 1.5px solid var(--ink); border-radius: 999px; padding: 3px; gap: 3px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; border-radius: 999px; padding: 8px 14px; cursor: pointer; font-weight: 500; font-size: 15px; }
.seg button.on { background: var(--blue); color: #fff; font-weight: 600; }

/* Forms */
.field { margin: 16px 0; }
.field > label, .field > .label { display: block; margin-bottom: 7px; }
.input, select.input, textarea.input { width: 100%; min-height: 46px; border: 1.5px solid var(--rule); border-radius: 12px; padding: 10px 13px; background: #fff; font-size: 16px; }
.input:focus { border-color: var(--blue); outline: none; box-shadow: 0 0 0 3px var(--blue-soft); }
textarea.input { min-height: 96px; resize: vertical; line-height: 1.45; }
.hint { font-size: 13.5px; color: var(--ink-2); margin-top: 6px; }
.stepper { display: inline-flex; align-items: center; gap: 4px; border: 1.5px solid var(--ink); border-radius: 999px; padding: 3px; }
.stepper button { width: 38px; height: 38px; border-radius: 50%; border: 0; background: var(--blue-soft); font-size: 20px; cursor: pointer; }
.stepper output { min-width: 44px; text-align: center; font-weight: 600; font-size: 18px; }
.switch { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; }
.switch input { width: 46px; height: 28px; appearance: none; -webkit-appearance: none; background: var(--rule); border-radius: 999px; position: relative; cursor: pointer; transition: background .15s; margin: 0; flex: none; }
.switch input::after { content: ''; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 2px rgba(19,33,74,.25); }
.switch input:checked { background: var(--blue); }
.switch input:checked::after { transform: translateX(18px); }

/* Sign in */
.signin { max-width: 420px; margin: 12vh auto 0; padding: 0 var(--pad); }
.signin h1 { margin: 18px 0 8px; }
.err { color: var(--ink); background: var(--pink-soft); border-left: 4px solid var(--pink); padding: 8px 12px; border-radius: 0 10px 10px 0; font-size: 15px; margin: 10px 0; }
.note { background: var(--blue-soft); border-left: 4px solid var(--blue); padding: 9px 12px; border-radius: 0 10px 10px 0; font-size: 15px; margin: 12px 0; }

/* Runner */
.run-top { position: sticky; top: 0; z-index: 20; background: rgba(255,255,255,0.97); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-bottom: 1px solid var(--rule); }
.run-top .in { max-width: var(--col); margin: 0 auto; padding: 8px var(--pad) 10px; }
.run-bar { display: flex; align-items: center; gap: 10px; }
.run-bar .what { flex: 1; min-width: 0; font-size: 14px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.icon-btn { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--rule); background: #fff; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; flex: none; }
.icon-btn svg { width: 18px; height: 18px; }
.clock { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-top: 4px; }
.clock .big { font-size: 46px; font-weight: 600; letter-spacing: -0.03em; line-height: 1; font-variant-numeric: tabular-nums; }
.clock .big.over { background: linear-gradient(transparent 58%, var(--pink-hl) 58%); }
.clock .sub { font-size: 13px; color: var(--ink-2); }
.pace { text-align: right; font-size: 14px; }
.pace b { display: inline-block; padding: 2px 9px; border-radius: 999px; background: var(--blue-soft); font-weight: 600; }
.pace b.behind { background: var(--pink-hl); }
.tbar { height: 6px; background: var(--rule-2); border-radius: 999px; margin-top: 8px; overflow: hidden; position: relative; }
.tbar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--blue); border-radius: 999px; }
.tbar.over i { background: var(--pink); }
.qstrip { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 10px 0 2px; scroll-behavior: smooth; }
.qstrip::-webkit-scrollbar { display: none; }
.qchip { flex: none; position: relative; width: 38px; height: 38px; border-radius: 50%; border: 1.5px solid var(--rule); background: #fff; font-size: 14px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; font-variant-numeric: tabular-nums; }
.qchip.ans { background: var(--blue-soft); border-color: var(--blue-soft); }
.qchip.cur { background: var(--blue); border-color: var(--blue); color: #fff; }
.qchip.bm::after { content: ''; position: absolute; top: -3px; right: -1px; width: 11px; height: 14px; background: var(--pink); clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 72%, 0 100%); }
.qchip:disabled { cursor: default; }
.qcard { padding-top: 18px; }
.qhead { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.qnum { font-size: 24px; font-weight: 600; letter-spacing: -0.02em; }
.qtime { display: flex; align-items: center; gap: 10px; margin: 10px 0 4px; font-size: 14px; color: var(--ink-2); }
.qtime .bar { flex: 1; height: 8px; border-radius: 999px; background: var(--rule-2); position: relative; overflow: hidden; }
.qtime .bar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--blue); }
.qtime .bar u { position: absolute; top: 0; bottom: 0; background: var(--pink); text-decoration: none; }
.qtime .bar s { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--ink); text-decoration: none; }
.opts { display: flex; gap: 10px; justify-content: space-between; margin: 18px 0 10px; }
.opt { flex: 1; max-width: 74px; aspect-ratio: 1; border-radius: 50%; border: 2px solid var(--ink); background: #fff; font-size: 22px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; -webkit-tap-highlight-color: transparent; transition: background .1s, color .1s; }
.opt.on { background: var(--blue); border-color: var(--blue); color: #fff; }
.opt.key { box-shadow: 0 0 0 4px var(--blue-hl); }
.opt:disabled { opacity: .35; cursor: not-allowed; }
.mp { margin: 14px 0; }
.mp-row { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-top: 1px solid var(--rule-2); }
.mp-row:first-child { border-top: 0; }
.mp-row .lab { width: 82px; font-size: 14px; color: var(--ink-2); flex: none; }
.mp-row .opts2 { display: flex; gap: 7px; flex-wrap: wrap; }
.mini { min-width: 46px; height: 42px; border-radius: 999px; border: 1.5px solid var(--ink); background: #fff; font-weight: 600; cursor: pointer; padding: 0 12px; }
.mini.on { background: var(--blue); border-color: var(--blue); color: #fff; }
.mini:disabled { opacity: .35; cursor: not-allowed; }
.tools { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 4px; }
.passage { border: 1px solid var(--rule); border-radius: var(--radius); padding: 14px 16px; margin: 12px 0; line-height: 1.65; font-size: 17px; white-space: pre-wrap; }
.passage .w { cursor: pointer; border-radius: 3px; }
.passage .w:hover { background: var(--blue-soft); }
.passage .w.seen { background: linear-gradient(transparent 62%, var(--pink-hl) 62%); }
.run-foot { position: sticky; bottom: 0; background: rgba(255,255,255,0.97); border-top: 1px solid var(--rule); padding: 10px 0 calc(10px + env(safe-area-inset-bottom)); margin-top: 22px; z-index: 10; }
.run-foot .in { display: flex; gap: 10px; }
.run-foot .btn { flex: 1; }
.banner { border-radius: var(--radius); padding: 12px 14px; margin: 12px 0; }
.banner.pink { background: var(--pink-soft); }
.banner.blue { background: var(--blue-soft); }
.banner .btns { margin-top: 8px; }
.review-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 8px; margin: 14px 0; }
.rq { position: relative; border: 1.5px solid var(--rule); border-radius: 14px; padding: 8px 6px; text-align: center; background: #fff; cursor: pointer; }
.rq b { display: block; font-size: 18px; }
.rq span { font-size: 13px; color: var(--ink-2); }
.rq.bm::after { content: ''; position: absolute; top: -3px; right: 8px; width: 11px; height: 15px; background: var(--pink); clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 72%, 0 100%); }
.rq.empty { border-style: dashed; }
.paused-veil { position: fixed; inset: 0; z-index: 40; background: rgba(255,255,255,0.97); display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 14px; text-align: center; padding: 24px; }
.paused-veil .big { font-size: 54px; font-weight: 600; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }

/* Marking and results */
.mrow { border-top: 1px solid var(--rule); padding: 12px 0; }
.mrow-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.mrow-head .n { font-weight: 600; width: 46px; }
.res { display: inline-flex; align-items: center; justify-content: center; width: 30px; height: 30px; border-radius: 50%; font-weight: 700; font-size: 15px; flex: none; }
.res.r { background: var(--blue); color: #fff; }
.res.w { background: var(--pink-hl); color: var(--ink); }
.res.u { border: 1.5px dashed var(--ink-3); color: var(--ink-3); }
.kv { display: flex; gap: 18px; flex-wrap: wrap; font-size: 14px; color: var(--ink-2); margin-top: 6px; }
.kv b { color: var(--ink); font-weight: 600; }
.score { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.score .v { font-size: 56px; font-weight: 600; letter-spacing: -0.03em; line-height: 1; }
.facts { list-style: none; margin: 10px 0 0; padding: 0; }
.facts li { padding: 7px 0 7px 18px; position: relative; border-top: 1px solid var(--rule-2); }
.facts li:first-child { border-top: 0; }
.facts li::before { content: ''; position: absolute; left: 0; top: 15px; width: 8px; height: 8px; border-radius: 50%; background: var(--blue); }
.facts li.pk::before { background: var(--pink); }

/* Charts */
.chart { width: 100%; max-width: 100%; height: auto; display: block; overflow: visible; }
.chart text { font-family: var(--font); fill: var(--ink-2); font-size: 12px; }
.chart .grid { stroke: var(--rule-2); stroke-width: 1; }
.chart .axis { stroke: var(--rule); stroke-width: 1; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; color: var(--ink-2); margin: 6px 0 0; }
.legend i { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.tip { position: fixed; z-index: 60; pointer-events: none; background: var(--ink); color: #fff; font-size: 13px; padding: 7px 10px; border-radius: 10px; max-width: 240px; line-height: 1.35; transform: translate(-50%, calc(-100% - 10px)); }
.hbar { height: 10px; border-radius: 999px; background: var(--rule-2); position: relative; overflow: hidden; min-width: 60px; }
.hbar i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 999px; background: var(--blue); }
.hbar.pk i { background: var(--pink); }
.hbar s { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--ink); }

/* Topics table */
.ttab { width: 100%; border-collapse: collapse; font-size: 15px; }
.ttab th { text-align: left; font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.1em; padding: 6px 8px 8px 0; border-bottom: 2px solid var(--ink); white-space: nowrap; }
.ttab td { padding: 10px 8px 10px 0; border-bottom: 1px solid var(--rule); vertical-align: middle; }
.ttab td.n, .ttab th.n { text-align: right; font-variant-numeric: tabular-nums; }
.ttab .bars { width: 34%; }
.ttab tr.grp td { border-bottom: 0; padding-top: 22px; font-weight: 600; }
.ttab tr.click { cursor: pointer; }
.ttab tr.click:hover td { background: var(--rule-2); }
.st { display: inline-block; font-size: 12px; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--rule); white-space: nowrap; cursor: pointer; background: #fff; }
.st[data-v='learning'] { background: var(--pink-soft); border-color: var(--pink-hl); }
.st[data-v='practising'] { background: var(--blue-soft); border-color: var(--blue-hl); }
.st[data-v='confident'] { background: var(--blue-hl); border-color: var(--blue-hl); font-weight: 600; }
@media (max-width: 600px) { .ttab .hide-sm { display: none; } .ttab .bars { width: 40%; } }

/* Do more */
.domore { list-style: none; margin: 0; padding: 0; counter-reset: dm; }
.domore li { display: flex; gap: 12px; align-items: flex-start; padding: 12px 0; border-top: 1px solid var(--rule); }
.domore li:first-child { border-top: 0; }
.domore li::before { counter-increment: dm; content: counter(dm); flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--pink-hl); display: inline-flex; align-items: center; justify-content: center; font-weight: 600; font-size: 14px; }
.domore .what { flex: 1; min-width: 0; }
.domore .why { font-size: 14px; color: var(--ink-2); }

/* Lookup sheet */
.sheet-bg { position: fixed; inset: 0; background: rgba(19,33,74,0.28); z-index: 50; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 51; background: #fff; border-radius: 22px 22px 0 0; max-height: 86vh; overflow-y: auto; padding: 10px var(--pad) calc(22px + env(safe-area-inset-bottom)); box-shadow: 0 -6px 30px rgba(19,33,74,0.18); }
@media (min-width: 900px) { .sheet-bg { display: none; } .sheet { left: auto; right: 24px; bottom: 24px; top: auto; width: 420px; border-radius: 22px; max-height: calc(100vh - 48px); } }

/* ---------- Small helpers ---------- */

/* ---------- Local store (IndexedDB) ---------- */

  del(key) { return this.tx('readwrite', (st) => st.delete(key)).catch(() => null); },
  clear() { return this.tx('readwrite', (st) => st.clear()).catch(() => null); },

/* ---------- Data: in memory, mirrored to IndexedDB, synced to the API ---------- */
const DB = { items: new Map(), meta: new Map() }; // meta: key -> { etag, dirty, del, rev }

  const mm = m || { etag: null, rev: 0 }; DB.meta.set(key, mm);

const wordKey = (w) => 'w/' + encodeURIComponent(w.toLowerCase()).slice(0, 220);

  const res = await fetch(API + path, { ...opts, headers: { Authorization: 'Bearer ' + PASS, 'Content-Type': 'application/json' }, keepalive: !!opts.keepalive });
  if (res.status === 401) { const e = new Error('passcode'); e.code = 401; throw e; }

/* ---------- Everything she has answered, flattened for the trackers ---------- */
function questionRows() {

        guess: q.guess, bm: q.bm, why: q.why, pace: s.mode === 'set' && s.limit ? s.limit / s.qs.length : paceMs(s.sec) });

/* ---------- What to do more of ---------- */
// Ranks question types and topics by how much more practice is likely to pay off: accuracy below her own average for
// that section, slower than the real pace, not practised lately, or not practised at all. Plain reasons come with each.
function recommendations(limit = 5) {
  const rows = questionRows();
  const out = [];
  const secStats = Object.fromEntries(SEC_ORDER.map((sec) => [sec, statsFor(rows.filter((r) => r.sec === sec))]));
  const baseAcc = (sec) => (secStats[sec].n >= 8 ? secStats[sec].acc : 0.7);
  const now = Date.now();
  const consider = (kind, id, name, sec, rs, practice) => {
    const st = statsFor(rs);
    const reasons = []; let score = 0;
    if (st.n >= 3) {
      const gap = baseAcc(sec) - st.acc;
      if (gap > 0.05) { score += gap * 100; reasons.push(`${st.right} of ${st.n} right (${pct(st.right, st.n)}%), against ${Math.round(baseAcc(sec) * 100)}% across ${SEC[sec].short}`); }
    }
    if (st.timedN >= 3 && st.pace) {
      const slow = st.avgMs / st.pace - 1;
      if (slow > 0.15) { score += slow * 45; reasons.push(`${mmss(st.avgMs)} a question, ${mmss(st.avgMs - st.pace)} over the ${mmss(st.pace)} pace`); }
    }
    if (st.n >= 3 && st.last && now - st.last > 14 * DAY && score > 0) { score += 6; reasons.push(`last practised ${ago(st.last)}`); }
    if (!rs.length) {
      const base = kind === 'type' ? 14 : 5;
      score += base; reasons.push('not practised yet');
    } else if (st.n > 0 && st.n < 3 && st.wrong >= 2) { score += 10; reasons.push(`${st.wrong} of ${st.n} wrong so far`); }
    if (score > 0) out.push({ kind, id, name, sec, score, why: reasons.join('; '), practice, st });
  };
  for (const t of TYPE_ORDER) consider('type', t, TYPE[t].name, TYPE[t].sec, rows.filter((r) => r.type === t), { sec: TYPE[t].sec, type: t });
  for (const [id, def] of Object.entries(TOPIC)) {
    const sec = sectionOfTopic(id); const rs = rows.filter((r) => r.topic === id);
    const type = def.grp === 'cr' ? 'CR' : def.grp === 'rc' ? 'RC' : id === 'logic' ? 'DS' : 'PS';
    if (!rs.length) continue; // untouched topics show in the topics tracker rather than here
    consider('topic', id, def.name, sec, rs, { sec: TYPE[type].sec, type, topic: id });
  }
  const exams = all('e/').filter((e) => e.total).sort((a, b) => (a.date < b.date ? 1 : -1));
  if (exams.length) {
    const e = exams[0]; const secs = [['Q', e.q], ['V', e.v], ['DI', e.di]].filter(([, v]) => v);
    if (secs.length === 3) {
      secs.sort((a, b) => a[1] - b[1]);
      if (secs[1][1] - secs[0][1] >= 2) out.push({ kind: 'section', id: secs[0][0], name: `Timed ${SEC[secs[0][0]].short} sections`, sec: secs[0][0], score: 12 + (secs[1][1] - secs[0][1]) * 2,
        why: `lowest section on ${e.name || 'your last practice exam'} (${secs[0][1]}, against ${secs[1][1]} and ${secs[2][1]})`, practice: { sec: secs[0][0], mode: 'gmat' } });
    }
  }
  out.sort((a, b) => b.score - a.score);
  // Keep a topic and its own question type from both taking a place when they say the same thing.
  const picked = [];
  for (const r of out) { if (picked.length >= limit) break; if (picked.some((p) => p.id === r.id)) continue; picked.push(r); }
  return picked;
}
function practiceHash(p, count) {
  const q = new URLSearchParams(); q.set('sec', p.sec); if (p.type) q.set('type', p.type); if (p.topic) q.set('topic', p.topic);
  if (p.mode) q.set('mode', p.mode); if (count) q.set('count', count);
  return '#/new?' + q.toString();
}

/* ---------- Looking up words ---------- */
// English from the Free Dictionary API (dictionaryapi.dev, built on Wiktionary) and Vietnamese from MyMemory. Both are
// called from her browser. Every word she looks up is saved with the sentence it came from.
function cleanWord(raw) {
  return String(raw || '').replace(/[’‘]/g, "'").replace(/^[^A-Za-z]+|[^A-Za-z]+$/g, '').replace(/\s+/g, ' ').trim().toLowerCase().slice(0, 60);

  catch (error) { return { error }; } finally { clearTimeout(timer); }

  if (w.endsWith('ies')) cut(3, 'y'); if (w.endsWith('s') && !w.endsWith('ss')) cut(1); if (w.endsWith('es')) cut(2);
  if (w.endsWith('ied')) cut(3, 'y'); if (w.endsWith('ed')) { cut(2); cut(1); if (w.length > 5 && w.at(-3) === w.at(-4)) cut(3); }
  if (w.endsWith('ing')) { cut(3); cut(3, 'e'); if (w.length > 6 && w.at(-4) === w.at(-5)) cut(4); }

/* ---------- Routing ---------- */
function route() {
  const h = location.hash.replace(/^#\/?/, '');
  const [path, qs] = h.split('?');
  const parts = path.split('/').filter(Boolean);
  const params = new URLSearchParams(qs || '');
  if (!parts.length) return { name: 'home', params };
  if (parts[0] === 's' && parts[1]) return { name: 'session', id: parts[1], params };
  if (parts[0] === 'e' && parts[1]) return { name: 'exam', id: parts[1], params };
  return { name: parts[0], params };
}
function currentSession() { const r = route(); return r.name === 'session' ? get('s/' + r.id) : null; }
function activeSession() { return all('s/').filter((s) => s.status === 'running').sort((a, b) => b.created - a.created)[0] || null; }

function render() {
  if (!PASS) { renderSignin(); return; }
  const r = route();
  if (r.name === 'session') { renderSession(r); return; }
  document.title = 'GMAT tracker';
  $('#app').innerHTML = header(r) + `<main class="wrap" id="main">${view(r)}</main>`;
  afterRender(r);
}
function renderMain() {
  if (!PASS) return;
  const r = route();
  if (r.name === 'session') { renderSession(r); return; }
  const m = $('#main'); if (!m) { render(); return; }
  const y = window.scrollY; m.innerHTML = view(r); afterRender(r); window.scrollTo(0, y);
}
function view(r) {
  switch (r.name) {
    case 'home': return homeView();
    case 'new': return newView(r);
    case 'words': return wordsView(r);
    case 'topics': return topicsView(r);
    case 'exams': return examsView(r);
    case 'exam': return examForm(r);
    case 'mistakes': return mistakesView(r);
    case 'bookmarks': return bookmarksView(r);
    case 'log': return logView(r);
    case 'settings': return settingsView(r);
    default: return `<p class="empty">Nothing here. <a href="#/">Go home</a></p>`;
  }
}
function afterRender(r) {

}
function header(r) {

async function trySignin(form) {

function startNew() {

function endConfirm(s) {

/* The clock: redrawn four times a second, saved on this device every 5 seconds and to the server every 30 */
let tickTimer = null, lastLocalSave = 0, lastServerSave = 0, wakeLock = null;
function tick(force) {
  const s = currentSession();
  if (!s || s.status !== 'running') return;
  const now = Date.now();
  if (s.clock.run) s.clock.hb = now;
  const u = used(s);
  const clk = $('#clk'); if (!clk) return;
  if (s.limit) {
    const left = s.limit - u;
    clk.textContent = left >= 0 ? mmss(left) : mmss(-left, { sign: true });
    clk.classList.toggle('over', left < 0);
    $('#clk-sub').textContent = left >= 0 ? `left of ${mmss(s.limit)}` : 'over time';
    const bar = $('#tbar'); if (bar) { bar.classList.toggle('over', left < 0); bar.firstElementChild.style.width = clamp((u / s.limit) * 100, 0, 100) + '%'; }
  } else { clk.textContent = mmss(u); $('#clk-sub').textContent = 'used, no limit'; }
  const pace = qPace(s);
  const pe = $('#pace');
  if (pe) {
    if (s.phase === 'review') pe.innerHTML = `<b>${plural(s.edits, 'change')} left</b>`;
    else {
      const delta = u - s.cur * pace;
      pe.innerHTML = Math.abs(delta) < 20000 && delta < pace ? '<b>On pace</b>' : delta > pace ? `<b class="behind">${mmss(delta - pace)} behind</b>` : delta < 0 ? `<b>${mmss(-delta)} ahead</b>` : '<b>On pace</b>';
      pe.insertAdjacentHTML('beforeend', `<div class="tiny muted" style="margin-top:4px">${answeredCount(s)} of ${s.qs.length} answered</div>`);
    }
  }
  if (s.cur >= 0) {
    const qms = qUsed(s, s.cur);
    const qc = $('#qclk'); if (qc) qc.textContent = mmss(qms);
    const share = clamp(qms / (pace * 2), 0, 1); const half = 0.5;
    const i = $('#qbar-i'), o = $('#qbar-u');
    if (i && o) { i.style.width = Math.min(share, half) * 100 + '%'; o.style.left = half * 100 + '%'; o.style.width = Math.max(0, share - half) * 100 + '%'; }
  }
  if (s.clock.run && s.limit && u >= s.limit) {
    if (s.rules) { endSection(s, 'time'); put(sKey(s), s, 'now'); toast('Time is up.'); releaseWake(); renderMain(); return; }
    if (!s.timeUpSeen) { s.timeUpSeen = true; put(sKey(s), s, 'soon'); renderRunner(s); return; }
  }
  if (now - lastLocalSave > 5000) { lastLocalSave = now; saveLocal(sKey(s)); }

}
async function holdWake() { try { if ('wakeLock' in navigator && !wakeLock && document.visibilityState === 'visible') { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } } catch { wakeLock = null; } }

function pauseSession(s) { if (!s || !s.clock.run) return; stopClock(s); put(sKey(s), s, 'now'); releaseWake(); }

/* ---------- Marking ---------- */
function parseKey(text, s) {

}

/* ---------- Results ---------- */
function resultsView(s) {
  const sc = sessionScore(s); const u = used(s); const pace = qPace(s);
  const answered = s.qs.filter((q) => complete(q.fmt, q.ans));
  const right = s.qs.filter((q) => q.res === 'r'), wrong = s.qs.filter((q) => q.res === 'w');
  const facts = [];
  if (right.length && wrong.length) facts.push([`Right answers took ${mmss(avg(right.map((q) => q.ms)))} on average, wrong ones ${mmss(avg(wrong.map((q) => q.ms)))}.`, avg(wrong.map((q) => q.ms)) > avg(right.map((q) => q.ms)) * 1.25]);
  const slow = s.qs.filter((q) => q.ms > pace * 1.5);
  if (slow.length) facts.push([`${plural(slow.length, 'question')} took more than ${mmss(pace * 1.5)} (one and a half times the pace)${slow.some((q) => q.res) ? `, and ${slow.filter((q) => q.res === 'r').length} of them came out right` : ''}.`, true]);
  if (s.limit) facts.push([u <= s.limit ? `Finished with ${mmss(s.limit - u)} to spare.` : `Went ${mmss(u - s.limit)} over the time limit.`, u > s.limit]);
  if (s.rules) {
    const edited = s.qs.filter((q) => q.edited);
    const fixed = edited.filter((q) => q.res === 'r' && q.first && q.key && q.first !== q.key).length, broke = edited.filter((q) => q.res === 'w' && q.first === q.key).length;
    facts.push([edited.length ? `Used ${plural(edited.length, 'change')} in review: ${fixed} turned a wrong answer right${broke ? `, ${broke} turned a right answer wrong` : ''}.` : 'No answers changed in review.', broke > 0]);
    if (s.revMs) facts.push([`Spent ${mmss(s.revMs)} reviewing.`, false]);
  }
  const bms = s.qs.filter((q) => q.bm);
  if (bms.length) facts.push([`Bookmarked ${plural(bms.length, 'question')}${bms.some((q) => q.res) ? `, ${bms.filter((q) => q.res === 'r').length} right` : ''}.`, false]);
  const guessed = s.qs.filter((q) => q.guess);
  if (guessed.length) facts.push([`Guessed ${guessed.length}${guessed.some((q) => q.res) ? `, ${guessed.filter((q) => q.res === 'r').length} right` : ''}.`, false]);
  const words = new Set(s.qs.flatMap((q) => q.words));
  if (words.size) facts.push([`Looked up ${plural(words.size, 'word')}: ${[...words].slice(0, 8).map((k) => esc(decodeURIComponent(k.slice(2)))).join(', ')}.`, false]);
  if (s.clock.pauses.length) facts.push([`Paused ${plural(s.clock.pauses.length, 'time')} for ${dur(sum(s.clock.pauses.map((p) => p.ms)))} in total, not counted.`, false]);
  return `<div class="page-head"><p class="label">${niceDate(s.ended || s.created)} · ${esc(sessionTitle(s))}</p>
    <div class="score" style="margin-top:10px"><span class="v">${sc.n ? `${sc.r}/${sc.n}` : '-'}</span><span>${sc.n ? `<span class="mark-b">${pct(sc.r, sc.n)}% right</span>` : 'not marked'}</span></div>
    <p class="muted" style="margin-top:8px">${mmss(u)} used${s.limit ? ` of ${mmss(s.limit)}` : ''} · ${mmss(answered.length ? u / Math.max(1, answered.length) : 0)} a question against a ${mmss(pace)} pace</p></div>
  <section class="sec"><div class="sec-head"><h2>Time on each question</h2></div>${paceChart(s)}</section>
  ${facts.length ? `<section class="sec"><h2>What stands out</h2><ul class="facts">${facts.map(([t, pk]) => `<li class="${pk ? 'pk' : ''}">${t}</li>`).join('')}</ul></section>` : ''}
  <section class="sec"><div class="sec-head"><h2>Questions</h2></div><ul class="rows">${s.qs.map((q, i) => resultRow(s, q, i)).join('')}</ul></section>
  <div class="btns" style="margin-top:20px"><button class="btn" data-act="re-mark">Change the marking</button><a class="btn primary" href="#/new">Practise again</a></div>
  <div style="margin-top:30px">${UI.delConfirm ? delConfirmBox() : `<button class="btn sm ghost" data-act="del-ask">Delete this set</button>`}</div>`;
}
function resultRow(s, q, i) {
  const res = q.res === 'r' ? '<span class="res r">✓</span>' : q.res === 'w' ? '<span class="res w">✗</span>' : '<span class="res u">?</span>';
  const bits = [q.type ? TYPE[q.type].name : null, q.topic ? TOPIC[q.topic].name : null, q.why ? REASON[q.why].long : null].filter(Boolean);
  return `<li><details><summary class="row-link" style="list-style:none">${res}<span class="row-main"><span class="t">#${q.n} · ${esc(showAns(q.fmt, q.ans))}${q.key && q.res === 'w' ? ` <span class="muted">(correct ${esc(showAns(q.fmt, q.key))})</span>` : ''}</span><div class="s">${esc(bits.join(' · ') || 'no type set')}</div></span><span class="row-side num">${mmss(q.ms)} ${q.bm ? ICON.ribbon : ''}</span></summary>
    <div class="kv">${q.first && q.first !== q.ans ? `<span>First answer <b>${esc(showAns(q.fmt, q.first))}</b></span>` : ''}${q.msRev ? `<span>Review <b>${mmss(q.msRev)}</b></span>` : ''}<span>Visits <b>${q.visits || 1}</b></span>${q.guess ? '<span><b>Guessed</b></span>' : ''}</div>
    ${q.take ? `<p class="small" style="margin-top:6px"><b>Next time:</b> ${esc(q.take)}</p>` : ''}${q.note ? `<p class="small">${esc(q.note)}</p>` : ''}
    ${q.words.length ? `<p class="small muted">Words: ${q.words.map((k) => esc(decodeURIComponent(k.slice(2)))).join(', ')}</p>` : ''}
    ${q.text ? `<div class="passage small" style="font-size:15px">${esc(q.text)}</div>` : ''}</details></li>`;
}

/* ---------- Charts (hand-drawn SVG, thin marks, hover for detail) ---------- */
const C = { blue: '#2F5FE8', pink: '#F0609E', grey: '#C3C9DA', ink: '#13214A', ink2: '#4B5679', rule: '#EEF1F8' };
// Charts are drawn at the width they will show at, so their text stays at its real size on a phone.
function chartW() { const vw = window.innerWidth || 390; const pad = vw >= 720 ? 32 : 18; return clamp(Math.min(vw, 760 + 2 * pad) - 2 * pad, 280, 760); }
function barPath(x, y, w, base, r = 4) {
  const h = base - y; if (h <= 0) return '';
  const rr = Math.min(r, w / 2, h);
  return `M${x},${base}V${y + rr}Q${x},${y} ${x + rr},${y}H${x + w - rr}Q${x + w},${y} ${x + w},${y + rr}V${base}Z`;
}
function paceChart(s) {
  const N = s.qs.length, W = chartW(), H = 230, L = 40, R = 12, T = 22, B = 26;
  const pw = W - L - R, ph = H - T - B, base = T + ph;
  const pace = qPace(s);
  const maxMs = Math.max(pace * 1.6, ...s.qs.map((q) => q.ms));
  const step = maxMs > 8 * 60000 ? 120000 : 60000; const yMax = Math.ceil(maxMs / step) * step;
  const y = (ms) => base - (ms / yMax) * ph;
  const slot = pw / N, bw = Math.min(24, slot * 0.64);
  let g = '';
  for (let t = 0; t <= yMax; t += step) g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}"/><text x="${L - 8}" y="${y(t) + 4}" text-anchor="end">${t ? mmss(t) : '0'}</text>`;
  const every = Math.max(1, Math.ceil(N / Math.max(4, Math.floor(pw / 30))));
  let bars = '';
  s.qs.forEach((q, i) => {
    const x = L + i * slot + (slot - bw) / 2;
    const col = q.res === 'r' ? C.blue : q.res === 'w' ? C.pink : C.grey;
    if (q.ms > 0) bars += `<path d="${barPath(x, y(q.ms), bw, base)}" fill="${col}"/>`;
    if (q.bm) bars += `<path d="M${x + bw / 2 - 4},${y(q.ms) - 13}h8v10l-4,-3l-4,3z" fill="${C.ink}"/>`;
    if ((i + 1) % every === 0 || i === 0) bars += `<text x="${x + bw / 2}" y="${H - 8}" text-anchor="middle">${i + 1}</text>`;
    const tipTxt = `Question ${i + 1} (#${q.n}) · ${mmss(q.ms)} · ${q.res === 'r' ? 'right' : q.res === 'w' ? 'wrong' : 'not marked'}${q.type ? ' · ' + q.type : ''}${q.topic ? ' ' + TOPIC[q.topic].name : ''}${q.bm ? ' · bookmarked' : ''}`;
    bars += `<rect x="${L + i * slot}" y="${T - 14}" width="${slot}" height="${ph + 14}" fill="transparent" data-tip="${esc(tipTxt)}"/>`;
  });
  const py = y(pace);
  const paceLine = `<line x1="${L}" x2="${W - R}" y1="${py}" y2="${py}" stroke="${C.ink2}" stroke-width="1"/><text x="${W - R}" y="${py - 6}" text-anchor="end" style="fill:${C.ink}">pace ${mmss(pace)}</text>`;
  const table = `<details class="small" style="margin-top:8px"><summary style="cursor:pointer" class="muted">As a table</summary><table class="ttab" style="margin-top:6px"><tr><th>Question</th><th class="n">Time</th><th>Result</th></tr>${s.qs.map((q, i) => `<tr><td>${i + 1} (#${q.n})</td><td class="n">${mmss(q.ms)}</td><td>${q.res === 'r' ? 'Right' : q.res === 'w' ? 'Wrong' : '-'}${q.bm ? ', bookmarked' : ''}</td></tr>`).join('')}</table></details>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Time on each question against the pace">${g}<line class="axis" x1="${L}" x2="${W - R}" y1="${base}" y2="${base}"/>${paceLine}${bars}</svg>
    <div class="legend"><span><i style="background:${C.blue}"></i>Right</span><span><i style="background:${C.pink}"></i>Wrong</span><span><i style="background:${C.grey}"></i>Not marked</span><span><svg width="10" height="12" style="vertical-align:-1px;margin-right:6px"><path d="M1,0h8v11l-4,-3l-4,3z" fill="${C.ink}"/></svg>Bookmarked</span><span><i style="height:2px;width:14px;background:${C.ink2};border-radius:0;vertical-align:3px"></i>Pace</span></div>${table}`;
}
function weeksChart() {
  const weeks = []; let start = weekStart();
  for (let k = 7; k >= 0; k--) { const from = start - k * 7 * DAY; weeks.push({ from, ...weekStats(from, from + 7 * DAY) }); }
  if (!weeks.some((w) => w.qs)) return '';
  const W = chartW(), H = 140, L = 6, R = 6, T = 24, B = 24, pw = W - L - R, ph = H - T - B, base = T + ph;
  const max = Math.max(...weeks.map((w) => w.qs), 10);
  const slot = pw / weeks.length, bw = Math.min(24, slot * 0.5);
  let out = '';
  weeks.forEach((w, i) => {
    const x = L + i * slot + (slot - bw) / 2, yy = base - (w.qs / max) * ph;
    const cur = i === weeks.length - 1;
    if (w.qs) out += `<path d="${barPath(x, yy, bw, base)}" fill="${cur ? C.blue : '#9DB5F7'}"/>`;
    if (w.qs && (cur || w.qs === Math.max(...weeks.map((v) => v.qs)))) out += `<text x="${x + bw / 2}" y="${yy - 6}" text-anchor="middle" style="fill:${C.ink}">${w.qs}</text>`;
    if (slot >= 52 || i % 2 === 1) out += `<text x="${x + bw / 2}" y="${H - 6}" text-anchor="middle">${new Date(w.from).toLocaleDateString('en-CA', { month: 'short', day: 'numeric' })}</text>`;

}
let tipEl = null, tipTimer = null;
// Hover shows the detail with a mouse. On a touch screen only chart marks show it (rows open instead), for a few seconds.
function bindTips() {
  if (bindTips.done) return; bindTips.done = true;
  const hide = () => { if (tipEl) tipEl.hidden = true; };
  const show = (e) => {
    const t = e.target.closest && e.target.closest('[data-tip]');
    if (!t || (e.pointerType !== 'mouse' && !t.closest('.chart'))) { hide(); return; }
    if (!tipEl) { tipEl = document.createElement('div'); tipEl.className = 'tip'; tipEl.setAttribute('role', 'tooltip'); document.body.appendChild(tipEl); }
    tipEl.textContent = t.getAttribute('data-tip'); tipEl.hidden = false;
    const r = t.getBoundingClientRect();
    tipEl.style.left = clamp(r.left + r.width / 2, 130, window.innerWidth - 130) + 'px'; tipEl.style.top = Math.max(r.top + 14, 60) + 'px';
    clearTimeout(tipTimer); if (e.pointerType !== 'mouse') tipTimer = setTimeout(hide, 2500);
  };
  document.addEventListener('pointerover', (e) => { if (e.pointerType === 'mouse') show(e); });
  document.addEventListener('pointerdown', show);
  document.addEventListener('scroll', hide, { passive: true });

/* ---------- Exam tracker ---------- */
function examsSorted() { return all('e/').filter((e) => e.total).sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : (a.created || 0) - (b.created || 0))); }
function latestExam() { const ex = examsSorted(); return ex[ex.length - 1] || null; }
function examChart(exams, target) {
  if (!exams.length) return '';
  const W = chartW(), H = 240, L = 40, R = 76, T = 22, B = 30, pw = W - L - R, ph = H - T - B, base = T + ph;
  const vals = exams.map((e) => e.total).concat(target ? [target] : []);
  const lo = Math.max(205, Math.floor((Math.min(...vals) - 30) / 50) * 50), hi = Math.min(805, Math.ceil((Math.max(...vals) + 30) / 50) * 50);
  const y = (v) => base - ((v - lo) / (hi - lo || 1)) * ph;
  const x = (i) => (exams.length === 1 ? L + pw / 2 : L + (i / (exams.length - 1)) * pw);
  let g = '';
  for (let v = lo; v <= hi; v += 50) g += `<line class="grid" x1="${L}" x2="${L + pw}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${v}</text>`;
  const tline = target ? `<line x1="${L}" x2="${L + pw}" y1="${y(target)}" y2="${y(target)}" stroke="${C.pink}" stroke-width="2"/><text x="${L + pw + 6}" y="${y(target) + 4}" style="fill:${C.ink}">target ${target}</text>` : '';
  const pts = exams.map((e, i) => `${x(i)},${y(e.total)}`).join(' ');
  const line = exams.length > 1 ? `<polyline points="${pts}" fill="none" stroke="${C.blue}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>` : '';

  'nf-text': (el) => { NEWF[el.dataset.k] = el.value; },
  'nf-num': (el) => { NEWF[el.dataset.k] = el.value; },
  'nf-rules': (el) => { NEWF.rules = el.checked; },
  'q-note': (el) => { const s = currentSession(); if (!s) return; s.qs[s.cur].note = el.value; clearTimeout(typingSave); typingSave = setTimeout(() => saveS(s, 'soon'), 800); },
  'q-text-draft': (el) => { UI.textDraft = el.value; },
  take: (el) => { const s = currentSession(); if (!s) return; s.qs[+el.dataset.i].take = el.value; clearTimeout(typingSave); typingSave = setTimeout(() => saveS(s, 'soon'), 800); },
  wq: (el) => { UI.wq = el.value; clearTimeout(typingSave); typingSave = setTimeout(() => { const pos = el.selectionStart; renderMain(); const n = $('[data-on="wq"]'); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch {} } }, 250); },
  't-note': (el) => { const id = el.dataset.id; clearTimeout(typingSave); const v = el.value; typingSave = setTimeout(() => put('t/' + id, { ...(get('t/' + id) || {}), id, note: v }), 700); },
  ex: (el) => { EXF[el.dataset.k] = el.value; },
};
document.addEventListener('input', (e) => { const el = e.target.closest('[data-on]'); if (el && ON[el.dataset.on]) ON[el.dataset.on](el, e); });
document.addEventListener('change', (e) => {
  const el = e.target.closest('[data-on]'); if (!el) return;
  if (el.dataset.on === 'nf-min' || el.dataset.on === 'nf-rules') { ON[el.dataset.on](el); renderMain(); }
});

/* Forms */
const FORMS = {
  signin: (f) => trySignin(f),
  lookup: (f) => { const w = f.w.value.trim(); if (w) runLookup(w, LK.ctx && LK.ctxWord === cleanWord(w) ? LK.ctx : null); },
  'lookup-page': (f) => { const w = f.w.value.trim(); if (w) openLookup(w, null); },
  new: () => startNew(),
  key: (f) => { const s = currentSession(); const n = parseKey(f.key.value, s); s.qs.forEach(markQ); saveS(s); renderMain(); toast(n ? `Filled in ${plural(n, 'answer')}` : 'Could not read that key'); },
  exam: () => saveExam(),
  settings: (f) => {
    const target = Number(f.target.value) || null;
    if (target && (target < 205 || target > 805)) { toast('A GMAT score is between 205 and 805.'); return; }
    put('m/settings', { ...(get('m/settings') || {}), name: f.name.value.trim() || DEFAULTS.name, testDate: f.testDate.value || null, target,
      setSize: clamp(Number(f.setSize.value) || DEFAULTS.setSize, 1, 60), showVi: f.showVi.checked }, 'now');
    toast('Saved'); render();
  },
};
document.addEventListener('submit', (e) => { const f = e.target.closest('form[data-form]'); if (!f) return; e.preventDefault(); FORMS[f.dataset.form]?.(f); });

/* Keyboard, on the practice screen */
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && LK.open) { closeLookup(); return; }
  const s = currentSession();
  if (!s || s.status !== 'running' || LK.open || e.metaKey || e.ctrlKey || e.altKey) return;
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName || '')) return;
  const k = e.key.toLowerCase();
  if (!s.clock.run) { if (k === 'p' || k === 'enter') { e.preventDefault(); A.resume(); } return; }
  const q = s.qs[s.cur];
  if (q && q.fmt === 'abc' && /^[a-e1-5]$/.test(k)) { e.preventDefault(); const v = /\d/.test(k) ? 'ABCDE'[Number(k) - 1] : k.toUpperCase(); if (!setAnswer(s, s.cur, v)) toast('No answer changes left.'); else { saveS(s); renderRunner(s); } return; }
  if (k === 'enter' || k === 'arrowright') { e.preventDefault(); if (s.cur >= 0) A.next(); return; }
  if (k === 'arrowleft') { e.preventDefault(); A.prev(); return; }
  if (k === 'm' && q) { e.preventDefault(); A.bm(); return; }
  if (k === 'g' && q) { e.preventDefault(); A.guess(); return; }
  if (k === 'p') { e.preventDefault(); A.pause(); return; }
  if (k === '/') { e.preventDefault(); A.lookup(); }
});

/* Moving between pages: leaving a running practice screen pauses its clock */
let prevRoute = route();
window.addEventListener('hashchange', () => {
  const r = route();
  if (prevRoute.name === 'session' && !(r.name === 'session' && r.id === prevRoute.id)) {
    const s = get('s/' + prevRoute.id); if (s && s.status === 'running') pauseSession(s);
  }
  if (r.name !== prevRoute.name || r.id !== prevRoute.id) {
    resetQuestionUI(); UI.delConfirm = false; UI.confirmEnd = false; UI.topicOpen = null; UI.exDel = false; UI.outConfirm = false; UI.bmOnly = false;
    if (r.name !== 'words') UI.flash = null;
    if (r.name !== 'exam') EXF = null;
  }
  prevRoute = r; closeLookup(); render(); window.scrollTo(0, 0);
  if (r.name === 'session') { const s = get('s/' + r.id); if (s && s.status === 'running' && s.clock.run) holdWake(); }
});
document.addEventListener('visibilitychange', () => {
  const s = currentSession();
  if (document.visibilityState === 'hidden') {
    if (s && s.status === 'running') { s.clock.hb = Date.now(); saveLocal(sKey(s)); }
    flush({ keepalive: true });
  } else {
    if (s && s.status === 'running' && s.clock.run) holdWake();
    if (PASS && Date.now() - lastPull > 60000) pull().then((changed) => { if (changed && !(s && s.status === 'running')) renderMain(); });
  }
});
window.addEventListener('pagehide', () => { const s = currentSession(); if (s && s.status === 'running') { commit(s); saveLocal(sKey(s)); } flush({ keepalive: true }); });
window.addEventListener('online', () => flush());

/* Start */
(async function init() {
  await loadLocal();
  // A set left running: on its own page the clock carries on (unless the page was closed for over 10 minutes);
  // opened anywhere else, it stops where it last ticked.
  const r0 = route();
  for (const s of all('s/')) {
    if (s.status !== 'running') continue;
    if (r0.name === 'session' && r0.id === s.id) recover(s);
    else if (s.clock.run) { commit(s, Math.max(s.clock.since, s.clock.hb || s.clock.since)); s.clock.run = false; s.clock.since = null; s.clock.pausedAt = s.clock.hb; saveLocal(sKey(s)); }
  }
  render();
  setInterval(tick, 250);
  if (PASS) {
    const changed = await pull();
    if (changed) renderMain();
    flush();
    const s = currentSession(); if (s && s.status === 'running' && s.clock.run) holdWake();
  }
})();

</script>
</body>
