const KEY = "gtwin-key";
const b64d = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const b64e = (u) => { let s = ""; for (let i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); };
const form = document.getElementById("gate"), go = document.getElementById("go"), msg = document.getElementById("msg");
function say(t, err) { msg.textContent = t; msg.className = err ? "err" : ""; }
async function derive(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
  return new Uint8Array(await crypto.subtle.deriveBits({ name: "PBKDF2", salt: b64d(DATA.salt), iterations: DATA.iterations, hash: "SHA-256" }, base, 256));
}
async function unlock(raw) {
  const key = await crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64d(DATA.iv) }, key, b64d(DATA.cipher));
  const k = b64e(raw);
  try { sessionStorage.setItem(KEY, k); } catch (e) {}
  const html = new TextDecoder().decode(plain).replace("__GTWIN_KEY__", k);
  document.open(); document.write(html); document.close();
}
form.addEventListener("submit", async (e) => {
  e.preventDefault();
  go.disabled = true; say("Opening…");
  try { await unlock(await derive(document.getElementById("pw").value)); }
  catch (err) { go.disabled = false; say("That password didn't work.", true); }
});
let saved = null;
try { saved = sessionStorage.getItem(KEY); } catch (e) {}
if (saved) {
  say("Opening…");
  unlock(b64d(saved)).catch(() => { try { sessionStorage.removeItem(KEY); } catch (e) {} say(""); });
}
</script>
