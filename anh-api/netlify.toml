# Netlify project for the arizvi.com/anh tracker's storage. Netlify builds from this folder (base directory anh-api).
[build]
  publish = "public"
  # Build only when something in this folder changed (and always on a project's first build).
  ignore = "if [ \"$CACHED_COMMIT_REF\" = \"$COMMIT_REF\" ]; then exit 1; fi; git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ."

[functions]
  directory = "netlify/functions"
